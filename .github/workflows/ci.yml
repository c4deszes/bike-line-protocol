name: CI

on:
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # TODO: use a container with cmake and python?
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python library
        working-directory: python-lib
        run: python -m pip install -e .[dev]

      - name: Install Python tools
        run: python -m pip install -r requirements.txt

      - name: Build and test
        run: cmake --workflow --preset workflow-test

      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: _build/conf-gcc-default/tests/coverage/coverage.xml
          badge: false
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '60 80'

      - name: Write to Job Summary
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

  example_arduino:
    name: Example (Arduino)
    runs-on: ubuntu-latest
    # TODO: use a container with arduino-cli and python?
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install platform
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:samd

      - name: Setup Python library
        working-directory: python-lib
        run: python -m pip install -e .[dev]

      - name: Generate code
        working-directory: examples/arduino
        run: python -m line_protocol.codegen codegen.json --output .

      - name: Build sketch
        working-directory: examples/arduino
        run: arduino-cli compile -b arduino:samd:arduino_zero_edbg --library ../..

  python_test:
    name: Python Test
    runs-on: ubuntu-latest
    container: python:3.14
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python library
        working-directory: python-lib
        run: python -m pip install -e .[dev]
      
      - name: Run tests
        working-directory: python-lib
        run: python -m pytest --cov=line_protocol --cov-report=xml

      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: python-lib/coverage.xml
          badge: false
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '60 80'

      - name: Write to Job Summary
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Install Doxygen
        run: sudo apt-get install doxygen

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python library
        working-directory: python-lib
        run: python -m pip install -e .[dev]

      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt

      - name: Build documentation
        run: cmake --workflow --preset workflow-docs

# TODO: linting?
