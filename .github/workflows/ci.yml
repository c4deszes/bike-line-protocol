name: CI

on:
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # TODO: use a container with cmake and python?
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python library
        working-directory: python-lib
        run: python -m pip install -e .[dev]

      - name: Install Python tools
        run: python -m pip install -r requirements.txt

      - name: Build and test
        run: cmake --workflow --preset workflow-test

      - name: Upload coverage report
        uses: 5monkeys/cobertura-action@master
        with:
          path: _build/conf-gcc-default/tests/coverage/coverage.xml
          show_line: true
          show_branch: true

  example_arduino:
    name: Example (Arduino)
    runs-on: ubuntu-latest
    # TODO: use a container with arduino-cli and python?
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install platform
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:samd

      - name: Setup Python library
        working-directory: python-lib
        run: python -m pip install -e .[dev]

      - name: Generate code
        working-directory: examples/arduino
        run: python -m line_protocol.codegen codegen.json --output .

      - name: Build sketch
        working-directory: examples/arduino
        run: arduino-cli compile -b arduino:samd:arduino_zero_edbg --library ../..

  python_test:
    name: Python Test
    runs-on: ubuntu-latest
    container: python:3.14
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python library
        working-directory: python-lib
        run: python -m pip install -e .[dev]
      
      - name: Run tests
        working-directory: python-lib
        run: python -m pytest --cov=line_protocol --cov-report=xml

      - name: Upload coverage report
        uses: 5monkeys/cobertura-action@master
        with:
          path: python-lib/coverage.xml
          show_line: true
          show_branch: true

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    # TODO: doxygen?
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python library
        working-directory: python-lib
        run: python -m pip install -e .[dev]

      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt

      - name: Build documentation
        run: cmake --workflow --preset workflow-docs

# TODO: linting?
