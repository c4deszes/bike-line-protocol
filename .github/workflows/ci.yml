name: CI

on:
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # TODO: use a container with cmake and python?
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python library
        working-directory: python-lib
        run: python -m pip install -e .[dev]

      - name: Install Python tools
        run: python -m pip install -r requirements.txt

      - name: Configure
        run: cmake --preset conf-gcc-default

      - name: Build
        run: cmake --build --preset build-tests-gcc

      - name: Run tests
        run: ctest --preset test-all-gcc

      - name: Generate coverage report
        run: cmake --build --preset build-cov-gcc

  example_arduino:
    name: Example (Arduino)
    runs-on: ubuntu-latest
    # TODO: use a container with arduino-cli and python?
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install platform
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:samd

      - name: Setup Python library
        working-directory: python-lib
        run: python -m pip install -e .[dev]

      - name: Generate code
        working-directory: examples/arduino
        run: python -m line_protocol.codegen codegen.json --output .

      - name: Build sketch
        working-directory: examples/arduino
        run: arduino-cli compile -b arduino:samd:arduino_zero_edbg --library ../..

  python_test:
    name: Python Test
    runs-on: ubuntu-latest
    container: python:3.14
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python library
        working-directory: python-lib
        run: python -m pip install -e .[dev]
      
      - name: Run tests
        working-directory: python-lib
        run: python -m pytest

      # TODO: results and coverage?
      
